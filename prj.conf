# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_SERIAL=y

CONFIG_GPIO=y

# Make sure printk is printing to the UART console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="PPG_DK_2026A"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Enable the NUS service
CONFIG_BT_NUS=y

# BT settings disabled — random BT address each boot, no NVS hang
CONFIG_BT_SETTINGS=n
CONFIG_SETTINGS=n
CONFIG_NVS=n
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Config logger — immediate mode so RTT output is never lost on crash
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

CONFIG_ASSERT=y
CONFIG_FAULT_DUMP=2
# Halt on fatal error instead of resetting — lets RTT capture the fault dump.
# Without this, crashes cause instant reboot and RTT output is lost.
CONFIG_RESET_ON_FATAL_ERROR=n

# Proto2403 has no external QSPI NOR flash.  nRF52840DK defconfig enables it
# by default; on Proto2403 the QSPI pins (P0.17-P0.22) are wired to MAX86141
# SPI — the QSPI driver crashes the firmware before main() runs.
CONFIG_NORDIC_QSPI_NOR=n

# Use internal RC oscillator for LFCLK — avoids MPSL hang if LFXO takes
# too long to stabilize on cold boot.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ── LSM6DSOTR IMU (I2C) ───────────────────────────────────────────────────────
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=y
CONFIG_LSM6DSO_TRIGGER_NONE=y           # polling mode — drdy-gpios not supported in NCS 2.9.0 binding
# ODR and FS are not Kconfig symbols in NCS 2.9.0 — set at runtime via sensor_attr_set() if needed
# Default after reset: ODR=104Hz, FS=±2g — both fine for motion artefact detection
